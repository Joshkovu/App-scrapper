services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: review_intelligence
      POSTGRES_USER: review_user
      POSTGRES_PASSWORD: review_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review_user -d review_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    environment:
      DJANGO_SECRET_KEY: change-me-in-production
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgres://review_user:review_password@db:5432/review_intelligence
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  postgres_data:
