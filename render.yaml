# Native Python runtime only — do not set Environment to Docker on Render.
# A root Dockerfile triggers Docker/BuildKit deploys and internal registry push failures.
services:
  - type: web
    name: App-scrapper
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DJANGO_ALLOWED_HOSTS
        value: app-scrapper-v7fb.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://app-scrapper.joashkuteesa223.workers.dev
      - key: CSRF_TRUSTED_ORIGINS
        value: https://app-scrapper.joashkuteesa223.workers.dev
