services:
  - type: web
    name: app-scrapper-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DJANGO_ALLOWED_HOSTS
        value: app-scrapper-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://app-scrapper.joashkuteesa223.workers.dev
      - key: CSRF_TRUSTED_ORIGINS
        value: https://app-scrapper.joashkuteesa223.workers.dev
